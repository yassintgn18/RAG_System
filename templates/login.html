<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Maintenance AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">Login to Your Account</h2>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">            <div>
                <label for="email" class="block mb-1 text-sm font-semibold text-gray-700">Email Address</label>
                <input type="email" id="email" name="email" required
                    class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label for="password" class="block mb-1 text-sm font-semibold text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div class="flex justify-between items-center">
                <label class="flex items-center text-sm">
                    <input type="checkbox" class="mr-2"> Remember me
                </label>
                <a href="#" class="text-blue-700 text-sm hover:underline">Forgot password?</a>
            </div>

            <button type="submit"
                class="w-full bg-blue-700 text-white py-2 rounded-md hover:bg-blue-800 transition font-semibold">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account?
            <a href="{{ url_for('SignUp') }}" class="text-blue-700 font-medium hover:underline">Sign up here</a>
        </p>
    </div>

</body>
</html>
