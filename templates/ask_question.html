<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask a Question</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .question-container {
      margin-top: 50px;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 10px;
      background-color: #f8f9fa;
    }
    .chunk-card {
      margin-top: 20px;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .error-message {
      color: #dc3545;
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      background-color: rgba(220, 53, 69, 0.1);
    }
  </style>
</head>
<body>

<div class="container question-container">
  <div class="row justify-content-center">
    <div class="col-12 text-center">
      <h1 class="display-4 text-primary">Ask a Question</h1>
      <p class="lead">Now you can ask questions related to the content you've uploaded!</p>
    </div>
    
    <div class="col-md-8 col-12">
      <form id="questionForm">
        <div class="mb-3">
          <label for="question" class="form-label">Your Question</label>
          <input type="text" class="form-control" id="question" required>
        </div>
        <button type="submit" class="btn btn-primary">Ask Question</button>
        <a href="/" class="btn btn-outline-secondary ms-2">Back to Upload</a>
      </form>
      
      <div id="loadingIndicator" class="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Processing your question...</p>
      </div>
      
      <div id="responseMessage" class="mt-4"></div>
      <div id="results" class="mt-4"></div> <!-- Results will appear here -->
    </div>
  </div>
</div>

<div class="footer">
  <p>&copy; 2025 Your Company. All rights reserved.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('questionForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const question = document.getElementById('question').value.trim();
    const loadingIndicator = document.getElementById('loadingIndicator');
    const responseMessage = document.getElementById('responseMessage');
    const resultsDiv = document.getElementById('results');

    // Reset UI
    responseMessage.innerHTML = '';
    resultsDiv.innerHTML = '';
    loadingIndicator.style.display = 'block';

    fetch('/ask_api', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ 'question': question })
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`Server returned ${response.status}: ${response.statusText}`);
      }
      return response.json();
    })
    .then(data => {
      loadingIndicator.style.display = 'none';

      if (data.error) {
        responseMessage.innerHTML = `<div class="error-message">${data.error}</div>`;
        return;
      }

      // Generated Answer with Follow-up (inside same card)
      if (data.generated_answer) {
        resultsDiv.innerHTML += `
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title text-success">Generated Answer</h5>
              <p class="card-text" style="white-space: pre-wrap;">${data.generated_answer}</p>
              ${data.follow_up_question ? `
                <hr>
                <p class="card-text text-info"><strong>Follow-up:</strong> ${data.follow_up_question}</p>
              ` : ''}
            </div>
          </div>
        `;
      }


      // Retrieved Chunks
      if (data.results && data.results.length > 0) {
        resultsDiv.innerHTML += `<h4 class="mt-4">Top Results:</h4>`;
        data.results.forEach((result, index) => {
          resultsDiv.innerHTML += `
            <div class="card chunk-card">
              <div class="card-body">
                <h5 class="card-title">Result ${index + 1}</h5>
                <p class="card-text">${result.text}</p>
                <p class="card-text">
                  <small class="text-muted">
                    Source: ${result.source_file} | Similarity: ${result.similarity.toFixed(4)}
                  </small>
                </p>
              </div>
            </div>
          `;
        });
      } else {
        resultsDiv.innerHTML += `<p class="mt-3">No relevant context found in the document.</p>`;
      }
    })
    .catch(error => {
      loadingIndicator.style.display = 'none';
      responseMessage.innerHTML = `
        <div class="error-message">
          <strong>Error asking question:</strong> ${error.message || 'Could not connect to server. Please try again.'}
          <p>Make sure you've uploaded a document first.</p>
        </div>
      `;
      console.error('Error:', error);
    });
  });
</script>

</body>
</html>
