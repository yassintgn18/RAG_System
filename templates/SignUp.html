<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Maintenance AI Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">Create an Account</h2>


    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="mb-4 text-sm text-{{ 'red-600' if category == 'error' else 'green-600' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

    <form action="{{ url_for('SignUp') }}" method="POST" class="space-y-5">

      <div>
        <label for="name" class="block mb-1 text-sm font-semibold text-gray-700">Full Name</label>
        <input type="text" id="name" name="name" required
               class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>

      <div>
        <label for="email" class="block mb-1 text-sm font-semibold text-gray-700">Email Address</label>
        <input type="email" id="email" name="email" required
               class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>

      <div>
        <label for="password" class="block mb-1 text-sm font-semibold text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>

      <div>
        <label for="confirm_password" class="block mb-1 text-sm font-semibold text-gray-700">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>

      <div>
        <label for="role" class="block mb-1 text-sm font-semibold text-gray-700">Role</label>
        <select id="role" name="role"
                class="w-full border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="1">Technician</option>
          <option value="2">Engineer</option>
          <option value="3">Supervisor</option>
        </select>
      </div>

      <button type="submit"
              class="w-full bg-blue-700 text-white py-2 rounded-md hover:bg-blue-800 transition font-semibold">
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a href="#" class="text-blue-700 font-medium hover:underline">Login here</a>
    </p>
  </div>

</body>
</html>
