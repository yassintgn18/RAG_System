
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Document Upload</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .upload-container {
      border: 2px dashed #007bff;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .upload-btn {
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
    }
    .upload-btn:hover {
      background-color: #0056b3;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 10px;
      background-color: #f8f9fa;
    }
    .file-list {
      text-align: left;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      padding: 15px;
      background-color: #ffffff;
      border-radius: 5px;
      border: 1px solid #dee2e6;
    }
    .processing-spinner {
      display: none;
      margin-top: 20px;
    }
    .result-container {
      margin-top: 20px;
      text-align: left;
      padding: 15px;
      background-color: #ffffff;
      border-radius: 5px;
      border: 1px solid #dee2e6;
      display: none;
    }
    .file-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
    }
    .remove-file {
      color: #dc3545;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <h1 class="display-4 text-primary">Bulk Document Upload</h1>
        <p class="lead">Upload multiple PDF or Word documents for processing</p>
      </div>

      <div class="col-md-8 col-12">
        <div class="upload-container">
          <h3><i class="bi bi-file-earmark-arrow-up"></i> Upload Multiple PDF or DOCX Files</h3>
          <input type="file" class="form-control mb-4" accept=".pdf,.docx" id="fileInput" multiple>
          <div class="file-list" id="fileList">
            <p class="text-muted">No files selected</p>
          </div>
          <button class="upload-btn mt-3" id="uploadBtn" onclick="uploadFiles()">Upload All Files</button>
          
          <div class="processing-spinner" id="processingSpinner">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Processing files, please wait...</p>
          </div>
          
          <div class="result-container" id="resultContainer">
            <h4>Processing Results</h4>
            <div id="resultMessage"></div>
            <div id="detailedResults" class="mt-3"></div>
          </div>
        </div>
      </div>
      
      <div class="col-md-8 col-12 mt-3 text-center">
        <a href="/upload_page" class="btn btn-outline-primary">Single File Upload</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2025 Your Company. All rights reserved.</p>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

  <script>
    let selectedFiles = [];
    
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      
      if (files.length > 0) {
        selectedFiles = files;
        updateFileList();
      }
    });
    
    function updateFileList() {
      const fileListEl = document.getElementById('fileList');
      
      if (selectedFiles.length === 0) {
        fileListEl.innerHTML = '<p class="text-muted">No files selected</p>';
        return;
      }
      
      let html = '';
      selectedFiles.forEach((file, index) => {
        html += `
          <div class="file-list-item">
            <span><i class="bi ${file.name.endsWith('.pdf') ? 'bi-file-earmark-pdf' : 'bi-file-earmark-word'}"></i> ${file.name}</span>
            <span class="remove-file" onclick="removeFile(${index})"><i class="bi bi-x-circle"></i></span>
          </div>
        `;
      });
      
      fileListEl.innerHTML = html;
      
      // Update button text
      document.getElementById('uploadBtn').textContent = `Upload ${selectedFiles.length} File${selectedFiles.length > 1 ? 's' : ''}`;
    }
    
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      updateFileList();
    }
    
    function uploadFiles() {
      if (selectedFiles.length === 0) {
        alert("Please select at least one file to upload.");
        return;
      }
      
      const formData = new FormData();
      selectedFiles.forEach(file => {
        formData.append('documents', file);
      });
      
      // Show processing spinner
      document.getElementById('processingSpinner').style.display = 'block';
      document.getElementById('uploadBtn').disabled = true;
      document.getElementById('resultContainer').style.display = 'none';
      
      fetch('/process_bulk_upload', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        // Hide spinner
        document.getElementById('processingSpinner').style.display = 'none';
        document.getElementById('uploadBtn').disabled = false;
        
        // Show results
        document.getElementById('resultContainer').style.display = 'block';
        
        if (data.success) {
          document.getElementById('resultMessage').innerHTML = `
            <div class="alert alert-success">
              ${data.message}
            </div>
          `;
          
          // Display detailed results
          let detailedHtml = '';
          
          if (data.details.success > 0) {
            detailedHtml += `<p class="text-success"><i class="bi bi-check-circle"></i> Successfully processed ${data.details.success} file(s)</p>`;
          }
          
          if (data.details.failed > 0) {
            detailedHtml += `<p class="text-danger"><i class="bi bi-x-circle"></i> Failed to process ${data.details.failed} file(s)</p>`;
            
            if (data.details.failed_files && data.details.failed_files.length > 0) {
              detailedHtml += '<ul class="text-danger">';
              data.details.failed_files.forEach(file => {
                detailedHtml += `<li>${file}</li>`;
              });
              detailedHtml += '</ul>';
            }
          }
          
          document.getElementById('detailedResults').innerHTML = detailedHtml;
          
          // Clear file list after successful upload
          selectedFiles = [];
          updateFileList();
          document.getElementById('fileInput').value = '';
        } else {
          document.getElementById('resultMessage').innerHTML = `
            <div class="alert alert-danger">
              Upload failed: ${data.error || 'Unknown error'}
            </div>
          `;
        }
      })
      .catch(error => {
        // Hide spinner
        document.getElementById('processingSpinner').style.display = 'none';
        document.getElementById('uploadBtn').disabled = false;
        
        // Show error
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('resultMessage').innerHTML = `
          <div class="alert alert-danger">
            An error occurred during upload. Please try again later.
          </div>
        `;
        console.error("Error:", error);
      });
    }
  </script>

</body>
</html>
